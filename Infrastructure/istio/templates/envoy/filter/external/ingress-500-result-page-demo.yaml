apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: ingress-500-result-page-demo
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: gateway-external-demo
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
      patch:
        operation: MERGE
        value:
          typed_config:
            "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager"
            local_reply_config:
              mappers:
                - filter:
                    status_code_filter:
                      comparison:
                        op: EQ
                        value:
                          default_value: 500
                          runtime_key: placeholder
                  status_code: 500
                  body:
                    inline_string: "Proxy: 500 Internal Server Error. An unexpected error occurred in the system. Please contact the system administrator. Thank you."
                  body_format_override:
                    text_format: "%LOCAL_REPLY_BODY%"
                    content_type: "text/html; charset=UTF-8"
