apiVersion: v1
kind: Service
metadata:
  name: istio-ingressgateway
  namespace: istio-system
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "istio-backend-config"}'
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8080
  selector:
    istio: ingressgateway
  type: ClusterIP
