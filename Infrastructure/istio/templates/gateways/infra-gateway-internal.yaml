apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: infra-gateway-internal
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - hosts:
        - "*"
      port:
        name: http
        number: 80
        protocol: HTTP
    - hosts:
        - "*"
      port:
        name: status-port
        number: 15021
        protocol: HTTP
