apiVersion: apps/v1
kind: Deployment
metadata:
  name: istio-ingressgateway
  namespace: new-caring-dev
  labels:
    app: istio-ingressgateway
    istio: ingressgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      istio: ingressgateway
  template:
    metadata:
      labels:
        app: istio-ingressgateway
        istio: ingressgateway
    spec:
      containers:
        - name: istio-proxy
          image: gcr.io/istio-release/proxyv2:1.20.3
          ports:
            - containerPort: 8080
              name: http2
            - containerPort: 15021
              name: status-port
          args:
            - proxy
            - router
            - --domain
            - $(POD_NAMESPACE).svc.cluster.local
            - --proxyLogLevel=warning
            - --proxyComponentLogLevel=misc:error
            - --log_output_level=default:info
            - --serviceCluster
            - istio-ingressgateway
            - --concurrency
            - "2"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ISTIO_META_ROUTER_MODE
              value: "sni-dnat"
            - name: PROXY_CONFIG
              value: |
                {
                  "proxyMetadata": {
                    "DNS_AGENT": "false"
                  }
                }
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 15021
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
