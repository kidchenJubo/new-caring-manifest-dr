apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: infra-gateway-internal-operator
  namespace: istio-system
spec:
  profile: default
  components:
    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          service:
            type: LoadBalancer
            loadBalancerIP: ""
            ports:
              - name: http2
                port: 80
                targetPort: 8080
