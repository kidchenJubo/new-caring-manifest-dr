apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: new-caring-web-page-internal-qat
  namespace: istio-system
spec:
  hosts:
    - "upgrade-qat-01.caringcm.com.tw"
    - "upgrade-qat-02.caringcm.com.tw"
  gateways:
    - istio-system/infra-gateway-internal-qat
  http:
    - match:
        - uri:
            prefix: /v2
        - uri:
            prefix: /
      route:
        - destination:
            host: new-caring-web-page.new-caring-web-page-qat.svc.cluster.local
            port:
              number: 80
