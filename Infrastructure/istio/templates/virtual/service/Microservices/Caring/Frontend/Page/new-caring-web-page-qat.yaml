apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: new-caring-web-page-qat
  namespace: istio-system
spec:
  hosts:
    - "new-caring-qat.jubo.health"
  gateways:
    - istio-system/infra-gateway-external-qat
  http:
    - route:
        - destination:
            host: new-caring-web-page.new-caring-web-page-qat.svc.cluster.local
            port:
              number: 80
