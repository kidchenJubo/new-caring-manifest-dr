apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: new-caring-mobile-api-release
  namespace: istio-system
spec:
  hosts:
    - "jcp-release-api-caring.jubo.health"
  gateways:
    - istio-system/infra-gateway-external-release
  http:
    - name: api
      corsPolicy:
        allowOrigins:
          - exact: "http://localhost:3000"
          - exact: "https://*.jubo.health"
          - exact: "https://*.caringcm.com.tw"
        allowMethods:
          - OPTIONS
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        allowHeaders:
          - "*"
        allowCredentials: true
        maxAge: "24h"
      match:
        - uri:
            regex: "(?i)/api/.*"
      route:
        - destination:
            host: new-caring-mobile-api.new-caring-mobile-api-release.svc.cluster.local
            port:
              number: 80
