apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: new-caring-web-api-storage-release
  namespace: istio-system
spec:
  hosts:
    - "new-caring-release-api-storage.jubo.health"
  gateways:
    - istio-system/infra-gateway-external-release
  http:
    - rewrite:
        authority: storage.googleapis.com
      route:
        - destination:
            host: storage.googleapis.com
            port:
              number: 443
