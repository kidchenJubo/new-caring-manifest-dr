apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: new-caring-web-api-internal-dev3
  namespace: istio-system
spec:
  hosts:
    - "upgrade-dev-03.caringcm.com.tw"
  gateways:
    - istio-system/infra-gateway-internal-dev
  http:
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: new-caring-web-api.new-caring-web-api-dev3.svc.cluster.local
            port:
              number: 80
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: new-caring-web.new-caring-web-dev3.svc.cluster.local
            port:
              number: 80