apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: new-caring-web-api-neg-dev
  namespace: new-caring-dev
spec:
  hosts:
    - "*.caringcm.com.tw"
  gateways:
    - istio-system/infra-gateway-neg
  http:
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: new-caring-web-api.new-caring-dev.svc.cluster.local
            port:
              number: 80
