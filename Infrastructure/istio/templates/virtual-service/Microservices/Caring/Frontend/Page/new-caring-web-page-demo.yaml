{{- if .Values.Settings.Urls.DemoFrontendCaring }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: new-caring-web-page-demo
  namespace: istio-system
spec:
  hosts:
    - {{ .Values.Settings.Urls.DemoFrontendCaring }}
  gateways:
    - istio-system/infra-gateway
  http:
    - route:
        - destination:
            host:  new-caring-web-page.new-caring-web-page-demo.svc.cluster.local
            port:
              number: 80
{{ end }}