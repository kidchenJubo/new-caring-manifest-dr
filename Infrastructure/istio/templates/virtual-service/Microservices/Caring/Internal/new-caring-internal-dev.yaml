{{- if .Values.Settings.Urls.DevBackendApiCaring }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: new-caring-internal-dev
  namespace: istio-system
spec:
  gateways:
    - istio-system/infra-gateway-internal
  hosts:
    - "*"
  http:
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: new-caring-web-api
            port:
              number: 80
    - match:
        - uri:
            prefix: /v2
      route:
        - destination:
            host: new-caring-web-page
            port:
              number: 80
    - match:
        - uri:
            exact: /health
      route:
        - destination:
            host: new-caring-web-api-neg
            port:
              number: 80
    - match:
        - uri:
            exact: /healthz/ready
      route:
        - destination:
            host: istio-ingressgateway-status.istio-system.svc.cluster.local
            port:
              number: 15021
{{ end }}