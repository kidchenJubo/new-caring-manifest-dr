apiVersion: v1
kind: Service
metadata:
  name: istio-ingressgateway
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/neg-auto-creation: "true"
spec:
  type: ClusterIP
  selector:
    app: istio-ingressgateway
    istio: ingressgateway
  ports:
    - name: http2
      protocol: TCP
      port: 80
      targetPort: 8080
    - name: status-port
      protocol: TCP
      port: 15021
      targetPort: 15021
