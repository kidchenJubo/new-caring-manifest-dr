{{- if .Values.Settings.Urls.DemoBackendApiCaring }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: new-caring-web-api-demo
  namespace: istio-system
spec:
  hosts:
    - {{ .Values.Settings.Urls.DemoBackendApiCaring }}
  gateways:
    - istio-system/infra-gateway
  http:
    - name: api
      corsPolicy:
        allowOrigins:
          - exact: "http://localhost:3000"
          - exact: "https://*.jubo.health"
          - exact: "https://*.caringcm.com.tw"
        allowMethods:
          - OPTIONS
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        allowHeaders:
          - "*"
        allowCredentials: true
        maxAge: "24h"
      match:
        - uri:
            regex: "/[A|a][P|p][I|i]/.*"
      route:
        - destination:
            host: new-caring-web-api.new-caring-web-api-demo.svc.cluster.local
            port:
              number: 80
    - name: resource
      match:
        - uri:
            regex: "/[R|r][E|e][S|s][O|o][U|u][R|r][C|c][E|e]/.*"
      route:
        - destination:
            host: new-caring-web-api.new-caring-web-api-demo.svc.cluster.local
            port:
              number: 80
{{ end }}