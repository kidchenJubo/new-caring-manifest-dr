# Infrastructure/argocd/values.yaml
argo-cd:
  global:
    domain: new-caring-argocd.jubo.health
    logging:
      format: json # 預設是 text
      level: info
  crds:
    install: false
  configs:
    rbac:
      policy.default: "role:admin"
    cm:
      # 修正 oidc: expected audience "argo-cd-cli" got ["argo-cd"]" 錯誤
      dex.config: |
        connectors:
          - type: microsoft
            id: microsoft
            name: Microsoft
            config:
              clientID: "50b6ed34-b030-4104-a14d-c8bc139b7d2b"
              clientSecret: $argocd-dex-ms-secret:clientSecret
              tenant: "organizations"
              hostedDomains: ["jubo.health"]
              allowedAudiences:
                - argo-cd
                - argo-cd-cli

    params:
      # 告訴 ArgoCD 不要自己在內部強制轉跳 HTTPS，交給 Gateway 處理
      server.insecure: true

      # 確保了 Helm chart 的所有後續部署都強制 dex 使用 http endpoint 而不是 https endpoint
      dexserver.disable.tls: true
      server.dex.server.strict.tls: false
      server.dex.server: http://argocd-dex-server:5556

  server:
    service:
      # 2026-09-09 DR 演練專用：這兩個值只在 `dr` 這個 branch 上被改掉，正式環境的
      # `main` branch 完全不受影響（跟上面 apps.global.repoURL 是同一個原因）。
      #
      # 原因：`argocd` 這個 Application 沒有帶 sourceHelm.valueFiles，ArgoCD 自己 sync
      # 自己時只會用這份 values.yaml，完全不會套用 scripts/caring-dr-argocd-overrides.yaml
      # 那個 helm CLI override——所以 bootstrap 當下用 --set/-f 疊出來的 LoadBalancer／
      # -dr NEG 名稱，只在「我們手動跑的那次 helm upgrade」有效，一旦操作者在 ArgoCD UI
      # 手動 sync 這個 argocd 自己的 Application，就會被這份 git 檔案的值蓋回去
      # （type 蓋回 ClusterIP，NEG 蓋回跟正式環境一樣的 new-caring-argocd-80，
      # 又會撞名觸發 SyncNetworkEndpointGroupFailed）。
      # 直接把正確值寫在這裡，不管 sync 幾次都不會跑掉。
      type: LoadBalancer
      annotations:
        # 提供 neg 接口給自建的 LB 整合
        # ⚠️ DR：改成 -dr 字尾避免跟正式環境的 new-caring-argocd-80 撞名，見
        # scripts/caring-dr-argocd-overrides.yaml 的完整實測踩雷說明（包含 Autopilot
        # 的 neg-annotation admission webhook 不接受空值/null 這件事）。
        cloud.google.com/neg: '{"exposed_ports": {"80":{"name": "new-caring-argocd-dr-80"}}}'

  # 不要對 SecretInit 注入 sidecar, 會導致 job 無法結束
  redisSecretInit:
    podLabels:
      sidecar.istio.io/inject: "false"

  # TODO 將 Azure Group 對應至 ArgoCD 權限
  #rbac:
  #  policy.csv: |
  #    g, "Azure-Admins-Group-ID", role:admin
  #    g, "Azure-Dev-Group-ID", role:readonly

# 簡化版本的 argocd apps, 去除掉重複的設定
apps:
  global:
    # 2026-09-09 DR 演練專用：這個值只在 `dr` 這個 branch（推去 DR fork repo `dr` remote 的
    # main 分支）上被改掉，正式環境的 `main` branch 完全不受影響。
    #
    # 原因：`--set-string apps.global.repoURL=...` 這種 helm CLI override 只在「當次」
    # helm install/upgrade 有效——一旦操作者在 ArgoCD UI 手動 sync 這個 argocd 自己的
    # Application（它會自我管理、從 git 重新 reconcile 這個 chart），ArgoCD 會依照
    # git 上實際寫的這個值重新套用，CLI override 完全不會留下來。之前 bootstrap.sh
    # 只靠 CLI override，導致 sync 完之後 repoURL 被打回正式環境的值，argocd-repo-server
    # 拿正式環境的 repoURL 去找 DR 專用的 repository credential（只註冊了 DR fork 的 URL），
    # 找不到對應憑證，出現 "authentication required: Repository not found"。
    # 正確做法是直接把這個值改在 git 追蹤的檔案裡（即這裡），這樣不管 sync 幾次都不會跑掉。
    repoURL: https://github.com/kidchenJubo/new-caring-manifest-dr.git
    targetRevision: main

  # -- Deploy Argo CD Applications within this helm release
  applications:
    # argocd
    argocd:
      syncWave: "-20"
      sourcePath: Infrastructure/argocd
      destinationNamespace: argocd
      extraSyncOptions:
        - RespectIgnoreDifferences=true
      ignoreReplicasDifferences: false

    # dev ↓↓↓

    # Caring
    new-caring-web-api-dev:
      sourcePath: Microservices/Caring/Backend/Api/new-caring-web-api
      sourceHelm:
        valueFiles:
          - values_dev.yaml
      destinationNamespace: new-caring-web-api-dev
      ignoreReplicasDifferences: false

    new-caring-web-api-dev2:
