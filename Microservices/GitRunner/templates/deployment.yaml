{{- if .Values.deployment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  labels:
    app.kubernetes.io/name: github-runner
    app.kubernetes.io/part-of: caring
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: github-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: github-runner
        app.kubernetes.io/part-of: caring
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: github-runner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: REPO_URL
              value: {{ .Values.github.repoUrl | quote }}
            - name: RUNNER_SCOPE
              value: {{ .Values.github.runnerScope | quote }}
            - name: RUNNER_GROUP
              value: {{ .Values.github.runnerGroup | quote }}
            - name: RUNNER_WORKDIR
              value: {{ .Values.github.workDir | quote }}
            - name: LABELS
              value: {{ join "," .Values.github.labels | quote }}
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authSecret.name }}
                  key: github_token
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pgrep -f "Runner.Listener|run.sh" >/dev/null
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pgrep -f "Runner.Listener|run.sh" >/dev/null
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
