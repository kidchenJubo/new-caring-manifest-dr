{{- if .Values.authSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.authSecret.name }}
  labels:
    app.kubernetes.io/name: github-runner
    app.kubernetes.io/part-of: caring
type: Opaque
stringData:
  github_token: {{ required "authSecret.githubToken is required when authSecret.create=true" .Values.authSecret.githubToken | quote }}
{{- end }}
