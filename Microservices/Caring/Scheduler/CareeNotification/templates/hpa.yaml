{{- if .Values.App.UseHPA }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "{{ .Chart.Name }}-hpa"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Chart.Name }}
  minReplicas: {{ .Values.App.MinReplicas }}
  maxReplicas: {{ .Values.App.MaxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
      scaleUp:
        selectPolicy: Min
        policies:
          - type: Pods
            value: 1
            periodSeconds: 30
        stabilizationWindowSeconds: 0
      scaleDown:
        selectPolicy: Min
        policies:
          - type: Pods
            value: 1
            periodSeconds: 30
        stabilizationWindowSeconds: 1800
{{- end }}