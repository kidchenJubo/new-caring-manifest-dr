kind: ConfigMap
apiVersion: v1
metadata:
  name: "{{ .Chart.Name }}-config"
data:
  ASPNETCORE_ENVIRONMENT: "{{ .Values.App.Env }}"

  ConnectionStrings__PostgreSqlMaster: "{{ .Values.App.ConnectionStrings.PostgreSqlMaster }}"
  ConnectionStrings__PostgreSqlSlave: "{{ .Values.App.ConnectionStrings.PostgreSqlSlave }}"
  ConnectionStrings__CHomeConnection: "{{ .Values.App.ConnectionStrings.CHomeConnection }}"
  ConnectionStrings__OldCaringConnection: "{{ .Values.App.ConnectionStrings.OldCaringConnection }}"
  OpenTelemetry__EndPoint: "{{ .Values.App.OpenTelemetry.EndPoint }}"
  OpenTelemetry__Protocol: "{{ .Values.App.OpenTelemetry.Protocol }}"
  Redis__ConnectionString: "{{ .Values.App.Redis.ConnectionString }}"
  JCP__EndPoint: "{{ .Values.App.JCP.EndPoint }}"
  JCP__Brand: "{{ .Values.App.JCP.Brand }}"
  JCP__Product: "{{ .Values.App.JCP.Product }}"
  JCP__Environment: "{{ .Values.App.JCP.Environment }}"
  JCP__Name: "{{ .Values.App.JCP.Name }}"