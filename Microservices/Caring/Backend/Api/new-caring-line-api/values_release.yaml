App:
  Replicas: 1
  MinReplicas: 1
  MaxReplicas: 6
  Version: "TODO-first-image-tag"
  UseHPA: true
  UsePDB:
    enabled: true
    UseUnavailable: true # use maxUnavailable for better flexibility with HPA
  Env: release
  ServiceAccount: "new-caring-line-api-release@static-map-242406.iam.gserviceaccount.com"
  AppResources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: 1000m
      memory: 1280Mi
  ConnectionStrings:
    PostgreSqlMaster: "Server=127.0.0.1;Port=5432;Database=caring;Userid=new-caring-line-api-release@static-map-242406.iam;Pooling=true;MinPoolSize=1;MaxPoolSize=200;ConnectionLifeTime=60;"
    PostgreSqlSlave: "Server=127.0.0.1;Port=5432;Database=caring;Userid=new-caring-line-api-release@static-map-242406.iam;Pooling=true;MinPoolSize=1;MaxPoolSize=200;ConnectionLifeTime=60;"
  OpenTelemetry:
    EndPoint: "http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317"
    Protocol: "grpc"
  Redis:
    ConnectionString: "jubo-mqtt.asia-east1-b.c.static-map-242406.internal:6379,defaultDatabase=3"

SqlProxy:
  Version: 2.18.1
  InstanceName: static-map-242406:asia-east1:caring-release-pg
  SqlProxyResources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 512Mi
