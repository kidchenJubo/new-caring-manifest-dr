App:
  Replicas: 3
  MinReplicas: 3
  MaxReplicas: 6
  Version: 2.1.11.1
  UseHPA: true
  UsePDB:
    enabled: true
    UseUnavailable: true # use maxUnavailable for better flexibility with HPA
  Env: release
  AppResources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: 1000m
      memory: 1280Mi
  ConnectionStrings:
    PostgreSqlMaster: "Server=127.0.0.1;Port=5432;Database=caring;Userid=n-c-b-a@static-map-242406.iam;Pooling=true;MinPoolSize=1;MaxPoolSize=200;ConnectionLifeTime=60;"
    PostgreSqlSlave: "Server=127.0.0.1;Port=5432;Database=caring;Userid=n-c-b-a@static-map-242406.iam;Pooling=true;MinPoolSize=1;MaxPoolSize=200;ConnectionLifeTime=60;"
    CHomeConnection: "Server=10.140.15.208,9900;Database=CHOME;User Id=sso_admin;Password=5086@Jubo_SSO@8012;TrustServerCertificate=true;"
    OldCaringConnection: "Server={SERVER},{PORT};Database={DBNAME};User Id=sso_admin;Password=5086@Jubo_SSO@8012;TrustServerCertificate=true;"
  OpenTelemetry:
    EndPoint: "http://opentelemetry-collector.opentelemetry.svc.cluster.local:4317"
    Protocol: "grpc"
  Redis:
    ConnectionString: "jubo-mqtt.asia-east1-b.c.static-map-242406.internal:6379,defaultDatabase=3"
  JCP:
    EndPoint: "http://jcp-release-api.jubo.health.internal"
    Brand: "caring"
    Product: "caring"
    Environment: "release"
    Name: "caring-release"
    Version: "1.0.0"
    ManageJcpCA: "ShareITN01CA01"
    ManageJcpCS: "f8f44b836dba473da5a25d908c642f84"
  # 新版 JuboCarePlatform.Sdk (signed-url 直傳) 用設定。
  # TODO: IdentityBaseUrl / StorageBaseUrl / ClientSecret 需向 JCP 團隊取得 dev1 環境實際值後填入。
  JcpClient:
    ClientId: "ltc-web"
    BaseUrl: "http://jcp2-api-gateway.jubo.health.internal/"
    ClientSecret: "04C89CB6-2A5F-43F5-B9A9-E9D40818F3D2"
    IdentityBaseUrl: "http://jcp2-api-gateway.jubo.health.internal/api/identity"
    StorageBaseUrl: "http://jcp2-api-gateway.jubo.health.internal/api/storage"
    OrganizationBaseUrl: "http://jcp2-api-gateway.jubo.health.internal/api/organization"
    Scope: "storage:write storage:read organization:read"
  CloudPubSub:
    ProjectId: "static-map-242406"
    DataSyncTopicId: "caring-staging-data-sync"
    UserActivityLogTopicId: "caring-release-user-activity-log"
    UserEventHandlingTopicId: "caring-release-user-event-handling"

SqlProxy:
  Version: 2.18.1
  InstanceName: static-map-242406:asia-east1:caring-release-pg
