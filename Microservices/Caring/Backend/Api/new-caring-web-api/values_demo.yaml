App:
  Replicas: 1
  MinReplicas: 1
  MaxReplicas: 1
  Version: 2.1.15.41
  UseHPA: false
  UsePDB:
    enabled: false
    UseUnavailable: false # use this should set replicas to 2 above
  Env: demo
  ServiceAccount: "new-caring-web-api-dev@static-map-242406.iam.gserviceaccount.com"
  AppResources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 300m
      memory: 768Mi
  ConnectionStrings:
    PostgreSqlMaster: "Server=127.0.0.1;Port=5432;Database=caring_demo;Userid=new-caring-web-api-dev@static-map-242406.iam;Pooling=true;MinPoolSize=1;MaxPoolSize=100;ConnectionLifeTime=60;"
    PostgreSqlSlave: "Server=127.0.0.1;Port=5432;Database=caring_demo;Userid=new-caring-web-api-dev@static-map-242406.iam;Pooling=true;MinPoolSize=1;MaxPoolSize=100;ConnectionLifeTime=60;"
    CHomeConnection: "Server=10.140.0.40,9900;Database=CHome;User Id=sso_admin;Password=5086@Jubo_SSO@8012;TrustServerCertificate=true;"
    OldCaringConnection: "Server={SERVER},{PORT};Database={DBNAME};User Id=sso_admin;Password=5086@Jubo_SSO@8012;TrustServerCertificate=true;"
  OpenTelemetry:
    EndPoint: "http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317"
    Protocol: "grpc"
  Redis:
    ConnectionString: "jubo-mqtt.asia-east1-b.c.static-map-242406.internal:6379,defaultDatabase=2"
  JCP:
    EndPoint: "http://jcp-demo-api.jubo.health.internal"
    Brand: "caring"
    Product: "caring"
    Environment: "demo"
    Name: "caring-demo"
    Version: "1.0.0"
    ManageJcpCA: "ShareITN01CA01"
    ManageJcpCS: "f8f44b836dba473da5a25d908c642f84"
  JcpClient:
    # TODO: 暫用 qat 的 JCP2 憑證/BaseUrl，demo 尚無專屬 JCP2 gateway，待跟 JCP2 團隊確認後改為 demo 專屬值
    ClientId: "ltc-web"
    ClientSecret: "222126EA-7035-4638-BAC2-93A50490BF8D"
    BaseUrl: "http://jcp2-api-gateway-qat.jubo.health.internal"
    Scope: "storage:write storage:read organization:read"
  CloudPubSub:
    ProjectId: "static-map-242406"
    DataSyncTopicId: "caring-demo-data-sync"
    UserActivityLogTopicId: "caring-demo-user-activity-log"
    UserEventHandlingTopicId: "caring-demo-user-event-handling"

SqlProxy:
  Version: 2.18.1
  InstanceName: static-map-242406:asia-east1:caring-dev-pg
  SqlProxyResources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 512Mi
