{{- if .Values.OtelCollector }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-otel-collector-config
  labels:
    app: {{ .Chart.Name }}-otel-collector
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 1s
        limit_mib: 1000
      resource:
        attributes:
          - key: environment
            value: "{{ .Values.App.Env }}"
            action: upsert
          - key: service.name
            value: "{{ .Chart.Name }}"
            action: upsert

    exporters:
      debug:
        verbosity: detailed
      {{- if .Values.OtelCollector.Exporters.JCP }}
      otlp/jcp:
        endpoint: {{ .Values.OtelCollector.Exporters.JCP }}
        tls:
          insecure: true
      {{- end }}
      {{- if .Values.OtelCollector.Exporters.GoogleCloud }}
      otlp/googlecloud:
        endpoint: telemetry.googleapis.com:443
        auth:
          authenticator: googleclientauth
      googlecloud:
        project: {{ .Values.OtelCollector.Exporters.GoogleCloud.Project }}
        log:
          default_log_name: otel-collector-exported-log
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 10000
      {{- end }}

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      pprof:
        endpoint: 0.0.0.0:1777
      googleclientauth:

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource, resource/gcp_project_id]
          exporters: [{{ if .Values.OtelCollector.Exporters.GoogleCloud }}otlp/googlecloud{{ end }}]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [{{ if .Values.OtelCollector.Exporters.JCP }}otlp/jcp{{ end }}]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [{{ if .Values.OtelCollector.Exporters.JCP }}otlp/jcp{{ end }}{{ if .Values.OtelCollector.Exporters.GoogleCloud }}, googlecloud{{ end }}]

      extensions: [health_check, pprof]
      telemetry:
        logs:
          level: info
{{ end }}