kind: ConfigMap
apiVersion: v1
metadata:
  name: "{{ .Chart.Name }}-config"
data:
  ASPNETCORE_ENVIRONMENT: "{{ .Values.App.Env }}"

  ConnectionStrings__PostgreSqlMaster: "{{ .Values.App.ConnectionStrings.PostgreSqlMaster }}"
  ConnectionStrings__PostgreSqlSlave: "{{ .Values.App.ConnectionStrings.PostgreSqlSlave }}"
  ConnectionStrings__CHomeConnection: "{{ .Values.App.ConnectionStrings.CHomeConnection }}"
  ConnectionStrings__OldCaringConnection: "{{ .Values.App.ConnectionStrings.OldCaringConnection }}"
  OpenTelemetry__EndPoint: "{{ .Values.App.OpenTelemetry.EndPoint }}"
  OpenTelemetry__Protocol: "{{ .Values.App.OpenTelemetry.Protocol }}"
  Redis__ConnectionString: "{{ .Values.App.Redis.ConnectionString }}"
  JCP__EndPoint: "{{ .Values.App.JCP.EndPoint }}"
  JCP__Brand: "{{ .Values.App.JCP.Brand }}"
  JCP__Product: "{{ .Values.App.JCP.Product }}"
  JCP__Environment: "{{ .Values.App.JCP.Environment }}"
  JCP__Name: "{{ .Values.App.JCP.Name }}"
  JCP__Version: "{{ .Values.App.JCP.Version }}"
  JCP__ManageJcpCA: "{{ .Values.App.JCP.ManageJcpCA }}"
  JCP__ManageJcpCS: "{{ .Values.App.JCP.ManageJcpCS }}"
  {{- if .Values.App.JcpClient }}
  JcpClient__ClientId: "{{ .Values.App.JcpClient.ClientId }}"
  JcpClient__ClientSecret: "{{ .Values.App.JcpClient.ClientSecret }}"
  JcpClient__BaseUrl: "{{ .Values.App.JcpClient.BaseUrl }}"
  JcpClient__IdentityBaseUrl: "{{ .Values.App.JcpClient.IdentityBaseUrl }}"
  JcpClient__StorageBaseUrl: "{{ .Values.App.JcpClient.StorageBaseUrl }}"
  JcpClient__OrganizationBaseUrl: "{{ .Values.App.JcpClient.OrganizationBaseUrl }}"
  JcpClient__Scope: "{{ .Values.App.JcpClient.Scope }}"
  {{- end }}
  CloudPubSub__ProjectId: "{{ .Values.App.CloudPubSub.ProjectId }}"
  CloudPubSub__DataSyncTopicId: "{{ .Values.App.CloudPubSub.DataSyncTopicId }}"
  CloudPubSub__UserActivityLogTopicId: "{{ .Values.App.CloudPubSub.UserActivityLogTopicId }}"
  CloudPubSub__UserEventHandlingTopicId: "{{ .Values.App.CloudPubSub.UserEventHandlingTopicId }}"
