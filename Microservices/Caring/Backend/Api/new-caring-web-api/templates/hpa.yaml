{{- if .Values.App.UseHPA }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "{{ .Chart.Name }}-hpa"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Chart.Name }}
  minReplicas: {{ .Values.App.MinReplicas }}
  maxReplicas: {{ .Values.App.MaxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
# 在 Kubernetes 的 HPA（橫向自動擴展）設定中，對於 C# (.NET) 服務，強烈不建議將記憶體（Memory）作為主要的 Scale 依據
#    - type: Resource
#      resource:
#        name: memory
#        target:
#          type: Utilization
#          averageUtilization: 85
  behavior:
      scaleUp:
        selectPolicy: Max
        policies:
          - type: Pods
            value: 2
            periodSeconds: 60
          - type: Percent
            value: 50
            periodSeconds: 60
        stabilizationWindowSeconds: 120
      scaleDown:
        selectPolicy: Min
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60
          - type: Percent
            value: 25
            periodSeconds: 60
        stabilizationWindowSeconds: 600
{{- end }}
