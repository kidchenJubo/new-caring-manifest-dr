{{- if .Values.App.UseHPA }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: "{{ .Chart.Name }}-hpa"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Chart.Name }}
  minReplicas: {{ .Values.App.MinReplicas }}
  maxReplicas: {{ .Values.App.MaxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
      scaleUp:
        selectPolicy: Max
        policies:
          - type: Pods
            value: 3
            periodSeconds: 30
          - type: Percent
            value: 100
            periodSeconds: 30
        stabilizationWindowSeconds: 30
      scaleDown:
        selectPolicy: Min
        policies:
          - type: Pods
            value: 1
            periodSeconds: 60
          - type: Percent
            value: 25
            periodSeconds: 60
        stabilizationWindowSeconds: 300
{{- end }}