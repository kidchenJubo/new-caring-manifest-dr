apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-otel-collector
  labels:
    app: {{ .Chart.Name }}-otel-collector
spec:
  selector:
    app: {{ .Chart.Name }}-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: metrics
      port: 8888
      targetPort: 8888
  type: ClusterIP 