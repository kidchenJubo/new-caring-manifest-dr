apiVersion: v1
kind: Service
metadata:
  name: "{{ .Chart.Name }}"
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/health-check-path: /health
spec:
  type: ClusterIP
  selector:
    app: "{{ .Chart.Name }}"
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
