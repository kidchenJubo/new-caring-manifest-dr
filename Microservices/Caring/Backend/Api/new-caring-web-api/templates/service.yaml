apiVersion: v1
kind: Service
metadata:
{{- if eq "Development" $.Values.App.Env }}
  annotations:
    cloud.google.com/neg: '{"exposed_ports": {"80":{"name": "{{ .Release.Namespace }}-80"}}}'
{{- end }}
  name: "{{ .Chart.Name }}"
spec:
  type: ClusterIP
  selector:
    app: "{{ .Chart.Name }}"
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
