kind: ConfigMap
apiVersion: v1
metadata:
  name: "{{ .Chart.Name }}-config"
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;
        error_log   /var/log/nginx/error.log warn;

        sendfile        on;
        keepalive_timeout  65;
        gzip  on;

        # Proxy cache configuration
        proxy_cache_path /var/cache/nginx/proxy levels=1:2 keys_zone=gcs_cache:10m max_size=1g inactive=60m use_temp_path=off;

        server {
            listen 80;
            server_name _;

            # Custom 404 error handling
            error_page 404 = @custom_404;
            
            location @custom_404 {
                default_type text/plain;
                return 404 "no found\n";
            }

            # Health check endpoint
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }

            # Proxy all other requests to GCS
            location / {
                # Redirect requests without file extension to index.html
                if ($uri !~* \.[a-z0-9]+$) {
                    rewrite ^(.*)$ /index.html break;
                }
                
                # Resolve DNS dynamically
                resolver 8.8.8.8 8.8.4.4 valid=300s;
                resolver_timeout 5s;

                # Proxy to GCS bucket
                proxy_pass https://storage.googleapis.com/{{ .Values.App.GcsBucket }}$uri;
                
                # Intercept backend errors to use custom error pages
                proxy_intercept_errors on;
                
                # Proxy settings
                proxy_set_header Host storage.googleapis.com;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                
                # Cache settings
                proxy_cache gcs_cache;
                proxy_cache_valid 200 1h;
                proxy_cache_valid 404 1m;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                proxy_cache_bypass $http_cache_control;
                add_header X-Cache-Status $upstream_cache_status;
                
                # Timeouts
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
                
                # Buffer settings
                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 4k;
                proxy_busy_buffers_size 8k;
                
                # Hide GCS headers
                proxy_hide_header x-goog-hash;
                proxy_hide_header x-goog-generation;
                proxy_hide_header x-goog-metageneration;
                proxy_hide_header x-goog-stored-content-encoding;
                proxy_hide_header x-goog-stored-content-length;
                proxy_hide_header x-goog-storage-class;
                proxy_hide_header x-guploader-uploadid;
            }
        }
    }