App:
  Replicas: 1
  Version: LTC-2527-TEST-2
  UseHPA: false
  UsePDB:
    enabled: false
    UseUnavailable: false # use this should set replicas to 2 above
  ContainerPort: 8080
  ServiceAccount: "new-caring-web-dev@static-map-242406.iam.gserviceaccount.com"
  AppResources:
    requests:
      cpu: 50m
      memory: 200Mi
    limits:
      cpu: 1000m
      memory: 1280Mi
  ConnectionStrings:
    PostgreSqlMaster: "Server=127.0.0.1;Port=5432;Database=caring_dev;Userid=new-caring-web-dev@static-map-242406.iam;Pooling=true;MinPoolSize=1;MaxPoolSize=100;ConnectionLifeTime=60;"
    PostgreSqlSlave: "Server=127.0.0.1;Port=5432;Database=caring_dev;Userid=new-caring-web-dev@static-map-242406.iam;Pooling=true;MinPoolSize=1;MaxPoolSize=100;ConnectionLifeTime=60;"
    CHomeConnection: "Server=10.140.15.234,9900;Database=CHOME;User Id=sso_admin;Password=5086@Jubo_SSO@8012;TrustServerCertificate=true;"
    OldCaringConnection: "Server={SERVER},{PORT};Database={DBNAME};User Id=sso_admin;Password=5086@Jubo_SSO@8012;TrustServerCertificate=true;"
  Redis:
    ConnectionString: "jubo-mqtt.asia-east1-b.c.static-map-242406.internal:6379,defaultDatabase=0"
  JCP:
    EndPoint: "http://jcp-dev-api.jubo.health.internal"
    Brand: "JCP"
    Product: "Caring"
    Environment: "dev"
    Name: "caring-dev"
    Version: "1.0.0"
    ManageJcpCA: "ShareITN01CA01"
    ManageJcpCS: "f8f44b836dba473da5a25d908c642f84"
  OpenIdConnect:
    Authority: "https://localhost:5001"
    ClientId: "caring-web-dev"
    ClientSecret: "dev-secret"
    ResponseType: "code"
    Scope: "openid profile email"
    CallbackPath: "/signin-oidc"
    SignedOutCallbackPath: "/signout-callback-oidc"
    SaveTokens: true
    GetClaimsFromUserInfoEndpoint: true
    RequireHttpsMetadata: false

SqlProxy:
  Version: 2.18.1
  InstanceName: static-map-242406:asia-east1:caring-dev-pg
  SqlProxyResources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 512Mi
