apiVersion: v1
kind: Service
metadata:
  annotations:
    # 2026-09-11 DR 演練專用：NEG 名稱加 -dr 字尾，避免跟正式環境撞名（同一個 project/zone
    # 下 NEG 名稱必須唯一，DR cluster 沿用跟正式環境相同的 namespace 名稱，若不改這裡會撞名，
    # 觸發 SyncNetworkEndpointGroupFailed，導致 pod 卡在 cloud.google.com/load-balancer-neg-ready
    # 這個 readiness gate 永遠不會通過。只在 `dr` 這個 branch 上改，正式環境 `main` 不受影響。
    cloud.google.com/neg: '{"exposed_ports": {"80":{"name": "{{ .Release.Namespace }}-dr-80"}}}'
  name: "{{ .Chart.Name }}"
spec:
  type: ClusterIP
  selector:
    app: "{{ .Chart.Name }}"
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: {{ .Values.App.ContainerPort }}