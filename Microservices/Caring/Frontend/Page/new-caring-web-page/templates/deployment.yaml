apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-caring-web-page
spec:
  replicas: {{ .Values.App.Replicas }}
  selector:
    matchLabels:
      app: new-caring-web-page
  template:
    metadata:
      labels:
        app: new-caring-web-page
    spec:
      serviceAccountName: new-caring-web-page
      {{- if .Values.App.ServiceAccountCredentials }}
      volumes:
        - name: secret-sa-volume
          secret:
            secretName: new-caring-web-page-sa-secret
      {{- end }}
      containers:
        - name: new-caring-web-page
          image: "asia-east1-docker.pkg.dev/jubo-care-platform/jcp-docker-registry/jcp-react-frontend-share:{{ .Values.App.Version }}"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: new-caring-web-page-config
          {{- if .Values.App.ServiceAccountCredentials }}
          volumeMounts:
            - mountPath: /app/secrets
              name: secret-sa-volume
          {{- end }}
          ports:
            - containerPort: 3000
          resources:
{{ toYaml .Values.App.AppResources | indent 11 }}