apiVersion: v1
kind: Service
metadata:
{{- if eq "dev" $.Values.App.ConfigMap.Data.DEPLOY }}
  annotations:
    cloud.google.com/neg: '{"exposed_ports": {"80"}}'
#    cloud.google.com/neg: '{"exposed_ports": {"80":{"name": "{{ .Release.Namespace }}-80"}}}'
{{- end }}
  name: "{{ .Chart.Name }}"
spec:
  type: ClusterIP
  selector:
    app: "{{ .Chart.Name }}"
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
