App:
  Replicas: 1
  Version: 1.2.1-caring
  ConfigMap:
    Data:
      DEPLOY: dev
  AppResources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: 400m
      memory: 800Mi

image:
  pullPolicy: IfNotPresent

workloadIdentity:
  enabled: true
  gcpServiceAccount: "new-caring-gar-reader@jubo-care-platform.iam.gserviceaccount.com"
  namespace: "new-caring-web-page-dev"

rbac:
  enabled: true
