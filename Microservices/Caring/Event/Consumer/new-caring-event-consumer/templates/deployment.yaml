apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.App.Replicas }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      {{- if .Values.App.ServiceAccountCredentials }}
      volumes:
        - name: secret-sa-volume
          secret:
            secretName: "{{ .Chart.Name }}-sa-secret"
      {{- end }}
      containers:
        - name: event-consumer-worker
          image: "asia-east1-docker.pkg.dev/static-map-242406/new-caring/caring-event-consumer-worker:{{ .Values.App.Version }}"
          envFrom:
            - configMapRef:
                name: "{{ .Chart.Name }}-config"
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MY_POD_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          {{- if .Values.App.ServiceAccountCredentials }}
          volumeMounts:
            - mountPath: /app/secrets
              name: secret-sa-volume
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources: 
{{ toYaml .Values.App.AppResources | indent 11 }}